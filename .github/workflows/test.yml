name: Tests & QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build NDJSON fixture for tests (small synthetic, no prod data)
        run: |
          node scripts/phase40/make-fixture.cjs --force --root .phase40-fixture

      - name: Run automated tests
        run: |
          node scripts/test.cjs
        env:
          MCQS_JSON_DATA_DIR: .phase40-fixture/data
          MCQS_JSON_INDEX_DIR: .phase40-fixture/indexes

      - name: Run benchmark smoke (file engine, read-only)
        run: |
          node scripts/benchmark.cjs
        continue-on-error: true