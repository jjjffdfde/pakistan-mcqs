# ============================================================
# Phase 40 - Pakistan MCQS Hub — Compose (file-engine runtime)
#   api : node runtime-v2/server.cjs (NDJSON file engine) [internal]
#   web : nginx static site + proxy /api -> api:8766  [public:80]
# Usage: docker compose up -d --build
# ============================================================
name: pakistan-mcqs-hub

services:
  api:
    image: node:22-alpine
    container_name: pakistan-mcqs-api
    restart: unless-stopped
    working_dir: /app
    command: ["node", "--max-old-space-size=384", "runtime-v2/server.cjs"]
    volumes:
      - ./:/app:ro
      - mcqs-userdata:/app/runtime-v2/userdata
    environment:
      MCQS_JSON_PORT: "8766"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8766/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build: .
    container_name: pakistan-mcqs-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  verify:
    image: node:22-alpine
    container_name: pakistan-mcqs-verify
    profiles: ["verify"]
    working_dir: /repo
    command: ["sh", "-c", "node scripts/lint.cjs && node backup/verify-backup.js && node scripts/benchmark.cjs"]
    volumes:
      - .:/repo:ro

volumes:
  mcqs-userdata:
